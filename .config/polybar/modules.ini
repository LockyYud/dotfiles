format-foreground = ${colors.foreground}

[module/memory]
type = internal/memory
interval = 2

; Ngưỡng cảnh báo khi RAM đạt 85%
warn-percentage = 85

; Format bình thường với ramp để hiển thị màu theo mức sử dụng
format = <ramp-used> <label>
format-padding = 1

; Format cảnh báo khi RAM >= 85%
format-warn = <ramp-used> <label-warn>
format-warn-foreground = ${colors.alert}
format-warn-padding = 1

; Label bình thường
label = %gb_used%
label-foreground = ${colors.foreground}

; Label cảnh báo - màu đỏ
label-warn = %gb_used%
label-warn-foreground = ${colors.alert}

; Ramp-used: icon thay đổi theo mức sử dụng RAM
; 0-20%: xanh lá
ramp-used-0 = 󰍛
ramp-used-0-foreground = ${colors.green}
; 20-40%: xanh lá
ramp-used-1 = 󰍛
ramp-used-1-foreground = ${colors.green}
; 40-60%: vàng
ramp-used-2 = 󰍛
ramp-used-2-foreground = ${colors.yellow}
; 60-80%: cam
ramp-used-3 = 󰍛
ramp-used-3-foreground = ${colors.orange}
; 80-100%: đỏ
ramp-used-4 = 󰍛
ramp-used-4-foreground = ${colors.alert}

format-underline = ${colors.bar6}


[module/cpu]
type = internal/cpu
interval = 2

; Ngưỡng cảnh báo khi CPU đạt 80%
warn-percentage = 80

; Format bình thường với ramp-load để hiển thị màu theo mức sử dụng
format = <ramp-load> <label>
format-padding = 1

; Format cảnh báo khi CPU >= 80%
format-warn = <ramp-load> <label-warn>
format-warn-foreground = ${colors.alert}
format-warn-padding = 1

; Label bình thường
label = CPU %percentage%%
label-foreground = ${colors.foreground}

; Label cảnh báo - màu đỏ
label-warn = %percentage%%
label-warn-foreground = ${colors.alert}

; Ramp-load: icon thay đổi theo mức sử dụng CPU
; 0-20%: xanh lá
ramp-load-0 = 
ramp-load-0-foreground = ${colors.green}
; 20-40%: xanh lá
ramp-load-1 = 
ramp-load-1-foreground = ${colors.green}
; 40-60%: vàng
ramp-load-2 = 
ramp-load-2-foreground = ${colors.yellow}
; 60-80%: cam
ramp-load-3 = 
ramp-load-3-foreground = ${colors.orange}
; 80-100%: đỏ
ramp-load-4 = 
ramp-load-4-foreground = ${colors.alert}

; Spacing (number of spaces, pixels, points) between individual per-core ramps
ramp-coreload-spacing = 1
ramp-coreload-0 = ▁
ramp-coreload-1 = ▂
ramp-coreload-2 = ▃
ramp-coreload-3 = ▄
ramp-coreload-4 = ▅
ramp-coreload-5 = ▆
ramp-coreload-6 = ▇
ramp-coreload-7 = █

format-underline = ${colors.bar5}
