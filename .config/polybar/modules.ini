[module/date]
type = internal/date
interval = 1

format                = <label>
format-foreground     = ${colors.foreground}
#format-background	= #ffffff
#format-radius	= 0.9
format-background     = ${colors.bar1}
format-prefix-foreground = ${colors.magenta}
format-prefix-padding = 1
label                 = %time%
label-foreground = ${colors.fg}
label-padding         = 1
time                  = %d/%m, %H:%M
time-alt              = %A, %d %B %Y



[module/network]
type = internal/network
; Name of the network interface to display. You can get the names of the
; interfaces on your machine with `ip link`
; Wireless interfaces often start with `wl` and ethernet interface with `eno` or `eth`
interface = wlp2s0

; If no interface is specified, polybar can detect an interface of the given type.
; If multiple are found, it will prefer running interfaces and otherwise just
; use the first one found.
; Either 'wired' or 'wireless'
; New in version 3.6.0
; interface-type = wireless

; ; Seconds to sleep between updates
; ; Default: 1
; interval = 3.0

; ; Test connectivity every Nth update
; ; A value of 0 disables the feature
; ; NOTE: Experimental (needs more testing)
; ; Default: 0
; ;ping-interval = 3

; ; @deprecated: Define min width using token specifiers (%downspeed:min% and %upspeed:min%)
; ; Minimum output width of upload/download rate
; ; Default: 3
; udspeed-minwidth = 5

; ; Accumulate values from all interfaces
; ; when querying for up/downspeed rate
; ; Default: false
; accumulate-stats = true

; ; Consider an `UNKNOWN` interface state as up.
; ; Some devices like USB network adapters have 
; ; an unknown state, even when they're running
; ; Default: false
; unknown-as-up = true

; ; Available tags:
; ;   <label-connected> (default)
; ;   <ramp-signal>
; format-connected = "%{A1:$HOME/.config/eww/System-Menu/launch:}<ramp-signal>%{A}"

; ; Available tags:
; ;   <label-disconnected> (default)
; format-disconnected = <label-disconnected>

; ; Default: (none)
; label-disconnected = "%{A1:$HOME/.config/eww/System-Menu/launch:}󰤭%{A}"
; label-disconnected-foreground = ${colors.foreground}
; label-disconnected-font = 7
; label-disconnected-padding = 1

; ; Only applies if <ramp-signal> is used
; ramp-signal-0 = "󰤯 "
; ramp-signal-1 = "󰤟 "
; ramp-signal-2 = "󰤢 "
; ramp-signal-3 = "󰤥 "
; ramp-signal-4 = "󰤨 "
; ramp-signal-foreground = ${colors.foreground}
; ramp-signal-background = ${colors.bar2}
; ramp-signal-font = 7
; ramp-signal-padding = 1

interval = 3.0
accumulate-stats = true
unknown-as-up = true
speed-unit = ''
ping-interval = 3

; Định dạng khi kết nối
format-connected = <ramp-signal>
label-connected = %essid% %downspeed:9%
label-connected-foreground = #eefafa
label-connected-background = ${colors.bar2}

; Định dạng khi mất kết nối
format-disconnected = <label-disconnected>
label-disconnected = 󰤭
label-disconnected-foreground = ${colors.disabled}
label-disconnected-background = ${colors.bar2}

; Ping thất bại (nếu bật ping-interval)
format-packetloss = <animation-packetloss>

; Icon cột sóng wifi
ramp-signal-0 = "󰤯 "
ramp-signal-1 = "󰤟 "
ramp-signal-2 = "󰤢 " 
ramp-signal-3 = "󰤥 "
ramp-signal-4 = "󰤨 "
ramp-signal-5 = 😈
ramp-signal-background = ${colors.bar2}

; Animation khi packet loss
animation-packetloss-0 = ⚠
animation-packetloss-0-foreground = #ffa64c
animation-packetloss-1 = 📶
animation-packetloss-1-foreground = #000000
animation-packetloss-framerate = 500

format-padding = 1
format-font = 2


[module/battery]
type = internal/battery

; This is useful in case the battery never reports 100% charge
; Default: 100
full-at = 100

; format-low once this charge percentage is reached
; Default: 10
; New in version 3.6.0
low-at = 20

; Use the following command to list batteries and adapters:
; $ ls -1 /sys/class/power_supply/
battery = BAT1
adapter = AC

; If an inotify event haven't been reported in this many
; seconds, manually poll for new values.
;
; Needed as a fallback for systems that don't report events
; on sysfs/procfs.
;
; Disable polling by setting the interval to 0.
;
; Default: 5
poll-interval = 5

; Available tags:
;   <label-charging> (default)
;   <bar-capacity>
;   <ramp-capacity>
;   <animation-charging>
format-charging = "%{A1:$HOME/.config/eww/System-Menu/launch:}<animation-charging>%{A}"

; Available tags:
;   <label-discharging> (default)
;   <bar-capacity>
;   <ramp-capacity>
;   <animation-discharging>
format-discharging = "%{A1:$HOME/.config/eww/System-Menu/launch:}<ramp-capacity>%{A}"

; Format used when battery level drops to low-at
; If not defined, format-discharging is used instead.
; Available tags:
;   <label-low>
;   <animation-low>
;   <bar-capacity>
;   <ramp-capacity>
; New in version 3.6.0
format-low = "%{A1:$HOME/.config/eww/System-Menu/launch:}<animation-low>%{A}"
format-full = "%{A1:$HOME/.config/eww/System-Menu/launch:}<ramp-capacity>%{A}"

; Available tokens:
;   %percentage% (default) - is set to 100 if full-at is reached
;   %percentage_raw%
;   %time%
;   %consumption% (shows current charge rate in watts)
label-charging = %percentage%%
label-charging-padding = 1

; Available tokens:
;   %percentage% (default) - is set to 100 if full-at is reached
;   %percentage_raw%
;   %time%
;   %consumption% (shows current discharge rate in watts)
label-discharging = %percentage%%
label-discharging-padding = 1

; Available tokens:
;   %percentage% (default) - is set to 100 if full-at is reached
;   %percentage_raw%
;   %time%
;   %consumption% (shows current discharge rate in watts)
; New in version 3.6.0
label-low = %percentage%%
label-low-padding = 1

; Only applies if <animation-charging> is used
animation-charging-0 = "  "
animation-charging-1 = "  "
animation-charging-2 = "  "
animation-charging-3 = "  "
animation-charging-4 = "  "
animation-charging-foreground = ${colors.secondary}
animation-charging-background = ${colors.bar2}
animation-charging-font = 5
; Framerate in milliseconds
animation-charging-framerate = 750

; Only applies if <ramp-capacity> is used
ramp-capacity-0 = "  "
ramp-capacity-1 = "  "
ramp-capacity-2 = "  "
ramp-capacity-3 = "  " 
ramp-capacity-4 = "  "  
ramp-capacity-background = ${colors.bar2}
ramp-capacity-font = 5

; Framerate in milliseconds
animation-discharging-framerate = 500

; Only applies if <animation-low> is used
; New in version 3.5.0
animation-low-0 = " "
animation-low-1 = " "
animation-low-framerate = 200
animation-low-background = ${colors.bar2}
animation-low-font = 5
animation-low-foreground = ${colors.alert}

[module/pulseaudio]
type = internal/pulseaudio

; Use PA_VOLUME_UI_MAX (~153%) if true, or PA_VOLUME_NORM (100%) if false
; Default: true
use-ui-max = false

; Interval for volume increase/decrease (in percent points)
; Default: 5
interval = 5

; Available tags:
;   <label-volume> (default)
;   <ramp-volume>
;   <bar-volume>
format-volume = "%{A1:$HOME/.config/eww/System-Menu/launch:}<ramp-volume>%{A}"

; Available tags:
;   <label-muted> (default)
;   <ramp-volume>
;   <bar-volume>
format-muted = "%{A1:$HOME/.config/eww/System-Menu/launch:}<label-muted>%{A}"

; Available tokens:
;   %percentage% (default)
;   %decibels%
;label-volume = %percentage%%

; Available tokens:
;   %percentage% (default)
;   %decibels%
label-muted = "󰝟"
label-muted-foreground = ${colors.alert}
label-muted-background = ${colors.bar2}
label-muted-font = 9
label-muted-padding = 1

; Only applies if <ramp-volume> is used
ramp-volume-0 = "󰕿"
ramp-volume-1 = "󰖀"
ramp-volume-2 = "󰕾"
ramp-volume-font = 9
ramp-volume-background = ${colors.bar2}
ramp-volume-padding = 1

; Right and Middle click
click-right = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
; click-middle = 
format-padding = 1

