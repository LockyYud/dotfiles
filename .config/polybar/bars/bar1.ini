[bar/mainbar-bspwm]
monitor = ${env:MONITOR:eDP-1}
#monitor = eDP
wm-restack = bspwm
width = 98%
height = 30
offset-x = 1%
offset-y = 1%
radius = 9.0
fixed-center = true
top = true
;separator = |

override-redirect = false
enable-ipc = true

background = ${colors.background}
foreground = #{colors.fg}

line-size = 4
#line-color = #f00

#border-size = 2
#border-top-size = 2
#border-bottom-size = 2
#border-left-size = 4
#border-right-size = 4
#border-color = transparent

padding-left = 0
padding-right = 0

module-margin-left = 0
module-margin-right = 0

include-file = $home/.config/polybar/fonts.ini

modules-left = bspwm
modules-center = xwindow
modules-right = bluetooth wireless-network date cpu temperature battery pulseaudio
#modules-right = spacing0 lblue1 spacing1 lblue2 spacing2 lblue3 spacing3 sl1 sl2 sl3 sl4 sr4
#tray-position = right
#tray-padding = 2
#tray-background = ${colors.bg}

;wm-restack = bspwm
;wm-restack = i3

;override-redirect = true

scroll-up = next
scroll-down = prev

;scroll-up = i3wm-wsnext
;scroll-down = i3wm-wsprev

cursor-click = pointer
cursor-scroll = ns-resize
