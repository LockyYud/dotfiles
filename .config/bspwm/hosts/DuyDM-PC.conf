# Host profile for DuyDM-PC.
# Sourced by bspwmrc and apply-display.sh when $(hostname) matches this file's name.

BSPWM_PRIMARY="eDP-1"
BSPWM_SECONDARY="DP-1-8"
BSPWM_TERTIARY="DP-1-9"

# Space-separated (no spaces in the paths themselves) so this file stays
# portable to both dash (bspwmrc) and bash (apply-display.sh).
BSPWM_WALLPAPERS="$HOME/Pictures/wallpapers/natra1.jpg $HOME/Pictures/wallpapers/natra3.jpg $HOME/Pictures/wallpapers/natra2.jpg"
